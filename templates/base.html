<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fashion GAN Studio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Fashion GAN <span>Studio</span></a>
    <nav aria-label="Primary navigation">
      <a href="{{ url_for('home') }}">Generator</a>
      <a href="{{ url_for('gallery') }}">Gallery</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Fashion GAN Studio · Fashion-MNIST DCGAN project</footer>
</body>
</html>
